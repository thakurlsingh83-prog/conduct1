<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Civil Services (Conduct) Rules, 1964 - Master Quiz</title>
    <style>
        :root {
            --bg-dark: #050813;
            --panel-bg: #0c1427;
            --accent-gold: #ffd700;
            --accent-cyan: #00e5ff;
            --text-light: #f8fafc;
            --correct-green: #10b981;
            --wrong-red: #ef4444;
            --border-glow: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at center, #172554 0%, #050813 100%);
        }

        .quiz-container {
            width: 100%;
            max-width: 1250px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25);
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 700px;
            overflow: hidden;
        }

        /* Left Side Panel */
        .left-panel {
            background: rgba(5, 8, 19, 0.95);
            border-right: 2px solid var(--border-glow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            color: var(--accent-gold);
            font-size: 1.05rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 8px;
            font-weight: 700;
        }

        .lifelines-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lifeline-btn, .nav-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-cyan);
            color: var(--text-light);
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.92rem;
        }

        .lifeline-btn:hover:not(:disabled), .nav-btn:hover:not(:disabled) {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .lifeline-btn:disabled, .nav-btn:disabled {
            background: #1f2937;
            border-color: #374151;
            color: #6b7280;
            cursor: not-allowed;
            opacity: 0.4;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 5px;
        }

        .prev-btn {
            border-color: #94a3b8;
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #f1f5f9;
        }

        .prev-btn:hover:not(:disabled) {
            background: #cbd5e1;
            color: #000;
            box-shadow: 0 0 12px #cbd5e1;
        }

        .next-btn {
            border-color: var(--accent-gold);
            background: linear-gradient(135deg, #78350f, #291203);
            color: var(--accent-gold);
        }

        .next-btn:hover:not(:disabled) {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold);
        }

        .prize-tracker {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 8px;
            background: #030712;
        }

        .prize-step {
            font-size: 0.76rem;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            color: #64748b;
        }

        .prize-step.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .prize-step.passed-correct {
            color: var(--accent-cyan);
            border-left: 2px solid var(--correct-green);
        }

        .prize-step.passed-wrong {
            color: #94a3b8;
            text-decoration: line-through;
            border-left: 2px solid var(--wrong-red);
        }

        /* Main Game Area */
        .main-panel {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .pattern-badge {
            background: #1e3a8a;
            color: #93c5fd;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #3b82f6;
            text-transform: uppercase;
        }

        .question-box {
            background: #090f1f;
            border: 1px solid var(--border-glow);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.5;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.05);
        }

        .statements-list {
            margin-top: 12px;
            margin-left: 10px;
            color: #e2e8f0;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #0f172a;
            border: 1.5px solid #1e293b;
            color: var(--text-light);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 0.96rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            background: #1e293b;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .option-btn.correct {
            background: var(--correct-green) !important;
            border-color: #34d399 !important;
            color: white;
            animation: pulse 1s infinite alternate;
        }

        .option-btn.wrong {
            background: var(--wrong-red) !important;
            border-color: #f87171 !important;
            color: white;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 5px var(--correct-green); }
            to { box-shadow: 0 0 20px #34d399; }
        }

        .explanation-box {
            background: #040814;
            border-left: 4px solid var(--accent-cyan);
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 0.92rem;
            color: #f1f5f9;
            display: none;
            margin-top: 10px;
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            padding: 25px;
            border-radius: 14px;
            max-width: 540px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            color: var(--accent-gold);
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .modal-body {
            margin-bottom: 20px;
            line-height: 1.5;
            color: #e2e8f0;
            font-size: 1rem;
        }

        .close-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 26px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .score-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: #030712;
            border: 1px solid var(--border-glow);
            border-radius: 8px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: bold;
        }

        .score-val-right {
            font-size: 1.6rem;
            color: var(--correct-green);
        }

        .score-val-wrong {
            font-size: 1.6rem;
            color: var(--wrong-red);
        }

        @media (max-width: 880px) {
            .quiz-container { grid-template-columns: 1fr; }
            .left-panel { border-right: none; border-bottom: 2px solid var(--border-glow); }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Left Side Panel with Lifelines and Navigation Controls -->
    <div class="left-panel">
        <div class="panel-title">Hotseat Controls</div>
        
        <div class="lifelines-container">
            <button class="lifeline-btn" id="life-5050" onclick="useFiftyFifty()">
                <span>🌓</span> 50:50 Lifeline
            </button>
            <button class="lifeline-btn" id="life-poll" onclick="useAudiencePoll()">
                <span>📊</span> Audience Poll
            </button>
            <button class="lifeline-btn" id="life-expert" onclick="useAskExpert()">
                <span>🎓</span> Ask The Expert
            </button>
        </div>

        <div class="nav-controls">
            <button class="nav-btn prev-btn" id="prev-btn" onclick="prevQuestion()" disabled>
                ◀ Back
            </button>
            <button class="nav-btn next-btn" id="next-btn" onclick="nextQuestion()" disabled>
                Next ▶
            </button>
        </div>

        <div class="panel-title" style="margin-top: 5px;">Prize Ladder</div>
        <div class="prize-tracker" id="prize-tracker"></div>
    </div>

    <!-- Main Quiz Display Panel -->
    <div class="main-panel">
        <div>
            <div class="question-header">
                <div>
                    <span id="q-number">Question 1 of 50</span>
                    <span class="pattern-badge" id="pattern-badge">Pattern</span>
                </div>
                <span id="q-prize">Prize: ₹1,00,000</span>
            </div>

            <div class="question-box">
                <div id="q-text">Loading question...</div>
                <div class="statements-list" id="q-statements"></div>
            </div>

            <div class="options-grid" id="options-container"></div>
        </div>

        <div class="explanation-box" id="explanation-box">
            <strong style="color: var(--accent-cyan);">Section Citation & Rule:</strong>
            <div id="explanation-text" style="margin-top: 5px;"></div>
        </div>
    </div>
</div>

<!-- Modal for Lifelines & Final Summary -->
<div class="modal" id="info-modal">
    <div class="modal-content">
        <div class="modal-title" id="modal-title">Notice</div>
        <div class="modal-body" id="modal-body"></div>
        <button class="close-btn" id="modal-close-btn" onclick="closeModal()">Continue</button>
    </div>
</div>

<script>
// 50 Questions strictly based on CCS (Conduct) Rules, 1964
const questions = [
    {
        type: "Statement",
        section: "Rule 1: Scope & Application",
        question: "Consider the following statements regarding the applicability of the CCS (Conduct) Rules, 1964 under Rule 1:",
        statements: [
            "a) The rules apply to every person appointed to a civil service or post in connection with the affairs of the Union, including civilians in Defence Services.",
            "b) The rules apply directly to railway servants and members of an All India Service without any exemption."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 0,
        citation: "Rule 1(3) applies to civil posts/services including defence civilians. Railway servants and All India Services are specifically excluded under Rule 1(3) provisos (a) and (b)."
    },
    {
        type: "Standard",
        section: "Rule 1: Second Proviso",
        question: "Under Rule 1(3) second proviso, certain specific rules (e.g., Rules 4, 6, 7, 12, 14, 18, 19, 20, 21) do NOT apply to non-gazetted employees in ports, defence installations, mines, and factories, provided they draw a pay not exceeding:",
        statements: [],
        options: [
            "Rs. 250 per mensem",
            "Rs. 500 per mensem",
            "Rs. 1,000 per mensem",
            "Rs. 1,500 per mensem"
        ],
        answer: 1,
        citation: "Rule 1(3) second proviso specifically exempts non-gazetted industrial/field employees drawing pay not exceeding Rs. 500 per mensem from specific conduct rules."
    },
    {
        type: "Fill in Blanks",
        section: "Historical Basis",
        question: "The Central Civil Services (Conduct) Rules, 1964 were revised and framed primarily based on the recommendations of the Committee on Prevention of Corruption headed by ________.",
        statements: [],
        options: ["Shri Lal Bahadur Shastri", "Shri K. Santhanam", "Shri S. Chandrasekaran", "Shri P. N. Kirpal"],
        answer: 1,
        citation: "The Foreword confirms that the 1964 rules were notified based on the recommendations of the Committee on Prevention of Corruption headed by late Shri K. Santhanam."
    },
    {
        type: "Matching",
        section: "General Code of Conduct",
        question: "Match List-I (Rule / Sub-Rule) with List-II (Subject / Provision under CCS Conduct Rules, 1964):",
        statements: [
            "(p) Rule 3A -- [1] Prohibition of sexual harassment of working women",
            "(q) Rule 3B -- [2] Promptness and Courtesy",
            "(r) Rule 3C -- [3] Observance of Government's policies (wildlife, environment, age of marriage)",
            "(s) Rule 15A - [4] Sub-letting and vacation of Government accommodation"
        ],
        options: [
            "p-2, q-3, r-1, s-4",
            "p-3, q-2, r-1, s-4",
            "p-2, q-1, r-3, s-4",
            "p-4, q-3, r-1, s-2"
        ],
        answer: 0,
        citation: "Rule 3A = Promptness & Courtesy; Rule 3B = Observance of Govt policies; Rule 3C = Sexual harassment prohibition; Rule 15A = Subletting accommodation."
    },
    {
        type: "Statement",
        section: "Rule 2: Definitions",
        question: "Consider the following statements regarding the definition of 'Members of family' under Rule 2(c):",
        statements: [
            "a) It includes a spouse separated from the Government servant by a decree or order of a competent Court.",
            "b) It includes a child or step-child who is wholly dependent on the Government servant, but excludes a child of whose custody the Government servant has been deprived by law."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 1,
        citation: "Rule 2(c)(i) explicitly excludes a spouse separated by a court decree. Rule 2(c)(ii) includes wholly dependent children but excludes those deprived of custody by law."
    },
    {
        type: "Standard",
        section: "Rule 3: Oral Instructions",
        question: "Under Rule 3(2)(iii) and (iv), what is the prescribed statutory procedure regarding oral instructions issued by an official superior to a subordinate?",
        statements: [],
        options: [
            "Oral instructions are completely prohibited in all administrative circumstances",
            "Oral instructions should be avoided; if unavoidable, the superior must confirm them in writing immediately thereafter, and the subordinate must seek written confirmation as early as possible",
            "Oral directions can only be confirmed if raised before the Joint Consultative Machinery",
            "Oral instructions require prior concurrence of the Minister-in-charge before execution"
        ],
        answer: 1,
        citation: "Rule 3(2)(iii)-(iv) mandates avoiding oral instructions, requiring prompt written confirmation by the superior and confirmation-seeking by the subordinate."
    },
    {
        type: "Statement",
        section: "Rule 3: Explanations",
        question: "Consider the following statements regarding the Explanations under Rule 3(2) of the Conduct Rules:",
        statements: [
            "a) A Government servant who habitually fails to perform assigned tasks within the time set and with expected quality is deemed to be lacking in devotion to duty.",
            "b) A Government servant is legally empowered to evade personal responsibility by seeking instructions/approvals from a superior when not necessary under distribution of powers."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 0,
        citation: "Explanation I states habitual delay/poor quality is lack of devotion to duty. Explanation II explicitly forbids evading responsibility by seeking unnecessary approvals."
    },
    {
        type: "Standard",
        section: "Official Protocol for MPs",
        question: "In the Warrant of Precedence at major state and public functions, where are Members of Parliament placed in relation to civil service officials?",
        statements: [],
        options: [
            "Below Secretaries to the Government of India",
            "Above officers of the rank of full General, Secretaries to the Government of India, and equivalent (at Article 30)",
            "Exactly equal to Additional Secretaries to the Government of India",
            "At the discretion of the District Magistrate"
        ],
        answer: 1,
        citation: "Decision No. 3 under Rule 3 specifies that MPs appear at Article 30 above officers of the rank of full General and Secretaries to the Government of India."
    },
    {
        type: "Fill in Blanks",
        section: "Dealings with MPs",
        question: "Under DOPT instructions on official dealings with Members of Parliament, an officer receiving a visiting MP in their office should ________.",
        statements: [],
        options: [
            "remain seated behind the desk to maintain official decorum",
            "rise in their seat to receive the Member and to see them off",
            "ask a subordinate Section Officer to conduct the entire interaction",
            "direct the Member to route all queries exclusively through the Ministry of Law"
        ],
        answer: 1,
        citation: "Decision No. 3 under Rule 3 dictates that an officer should rise in his seat to receive the Member of Parliament and to see him off."
    },
    {
        type: "Matching",
        section: "Rule 5: Political Associations",
        question: "Match List-I (Organization / Association) with List-II (Status under Rule 5 regarding Political Neutrality):",
        statements: [
            "(p) Rashtriya Swayam Sewak Sangh (R.S.S.) & Jamaat-e-Islami - [1] Permissible with prior permission of Head of Office",
            "(q) Bharat Sewak Samaj ---------------------------------- [2] Permissible without prior permission, with knowledge of HoD",
            "(r) Sanyukta Sadachar Samiti ----------------------------- [3] Prohibited; attracts Rule 5(1) disciplinary action",
            "(s) Anand Marg Movement & its affiliated bodies ----------- [4] Prohibited; attracts Rule 5(1) disciplinary action"
        ],
        options: [
            "p-3, q-1, r-2, s-4",
            "p-1, q-3, r-2, s-4",
            "p-3, q-2, r-1, s-4",
            "p-4, q-1, r-2, s-3"
        ],
        answer: 0,
        citation: "RSS/Jamaat and Anand Marg are banned under Rule 5(1); Bharat Sewak Samaj requires prior permission; Sanyukta Sadachar Samiti requires HoD knowledge only."
    },
    {
        type: "Statement",
        section: "Honorary Employment in Civil Posts",
        question: "Consider the following statements regarding the employment of honorary workers in civil posts:",
        statements: [
            "a) An honorary worker should be paid a nominal salary of Re. 1 per month specified in the appointment order to bring them within the ambit of Conduct Rules.",
            "b) In the case of Members of Parliament appointed in an honorary capacity, the nominal salary of Re. 1 per month must be strictly enforced to avoid holding an office of profit under Article 102(1)(a)."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 0,
        citation: "Statement (a) is correct. Statement (b) is false because nominal salary should NOT be enforced for MPs to prevent disqualification under Article 102(1)(a)."
    },
    {
        type: "Standard",
        section: "Rule 4: Private Employment of Dependents",
        question: "Under Rule 4(2)(i), when may a Group 'A' officer permit their child or dependent to accept employment in a private company with which the officer has official dealings?",
        statements: [],
        options: [
            "Freely, without any intimation or permission",
            "Only with the previous sanction of the Government (or provisional acceptance reported immediately if urgent)",
            "With the permission of the Union Public Service Commission (UPSC)",
            "Group 'A' dependents are permanently barred from working in any private company"
        ],
        answer: 1,
        citation: "Rule 4(2)(i) requires previous sanction of Government, or immediate reporting if urgent, before a dependent accepts such employment."
    },
    {
        type: "Statement",
        section: "Rule 5: Elections & Proposing Candidates",
        question: "Consider the following statements regarding the political rights of a Government servant under Rule 5:",
        statements: [
            "a) A Government servant qualified to vote at an election may exercise their franchise, provided they give no indication of how they propose to vote or have voted.",
            "b) A Government servant is legally permitted to propose or second the nomination paper of a candidate in a parliamentary or legislative election."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 0,
        citation: "Statement (a) is correct (Rule 5(4) proviso). Statement (b) is false because proposing/seconding nomination constitutes taking part in election under Rule 5(4)."
    },
    {
        type: "Standard",
        section: "Representation of People Act Section 134A",
        question: "Under Section 134A of the Representation of the People Act, 1951 (highlighted in Conduct Rules instructions), what penalty is prescribed if a person in Government service acts as an election agent, polling agent, or counting agent of a candidate?",
        statements: [],
        options: [
            "Censure only",
            "Fine of Rs. 500 without imprisonment",
            "Imprisonment for a term which may extend to three months, or with fine, or with both",
            "Compulsory retirement on the spot"
        ],
        answer: 2,
        citation: "Section 134A of RPA 1951 punishes acting as election/polling/counting agent with imprisonment up to 3 months, or fine, or both."
    },
    {
        type: "Fill in Blanks",
        section: "Rule 5(2): Subversive Activities",
        question: "Under Rule 5(2), where a Government servant is unable to prevent a member of their family from taking part in any subversive movement against the Government, they shall ________.",
        statements: [],
        options: [
            "immediately resign from their post",
            "lodge an FIR with the local police station",
            "make a report to that effect to the Government",
            "place the family member under house arrest"
        ],
        answer: 2,
        citation: "Rule 5(2) mandates that if unable to prevent a family member from assisting subversive movements, the officer shall make a report to the Government."
    },
    {
        type: "Matching",
        section: "Rule 13: Gift Ceilings",
        question: "Match List-I (Occasion / Source of Gift) with List-II (Monetary Limit for Reporting/Sanction under Rule 13):",
        statements: [
            "(p) Wedding/funeral gift from relatives to Group 'A' officer - [1] Exceeding Rs. 7,000",
            "(q) Wedding/funeral gift from relatives to Group 'B' officer - [2] Exceeding Rs. 4,000",
            "(r) General gift from non-relatives to Group 'A' or 'B' ------ [3] Exceeding Rs. 1,500",
            "(s) Retention of gifts received from foreign dignitaries ---- [4] Market value up to Rs. 1,000"
        ],
        options: [
            "p-1, q-2, r-3, s-4",
            "p-2, q-1, r-4, s-3",
            "p-1, q-3, r-2, s-4",
            "p-4, q-2, r-1, s-3"
        ],
        answer: 0,
        citation: "Rule 13(2): Group A relative gift = Rs 7,000; Group B = Rs 4,000; Rule 13(3): General gift Group A/B = Rs 1,500; Rule 13(4): Foreign gifts = Rs 1,000."
    },
    {
        type: "Statement",
        section: "Rule 13: Definition of Gift",
        question: "Consider the following statements regarding the acceptance of gifts under Rule 13:",
        statements: [
            "a) Free transport, boarding, and lodging provided by a person having official dealings with a Government servant falls under the definition of a 'gift'.",
            "b) A casual meal, lift, or other social hospitality is deemed to be a gift requiring prior government sanction."
        ],
        options: ["Only a", "Only b", "Both a and b", "Neither a nor b"],
        answer: 0,
        citation: "Rule 13 Explanation includes free boarding/transport as gifts. Note 1 explicitly provides that casual meals, lifts, or social hospitality are NOT gifts."
    },
    {
        type: "Standard",
        section: "Rule 7: Definition of Strike",
        question: "Under Rule 7(ii) and clarificatory decisions, which of the following acts is categorized as a 'strike' by Government employees?",
        statements: [
            "1. Mass absence from work without permission (under the guise of 'mass casual leave')",
            "2. Refusal to work overtime where such overtime work is necessary in public interest",
            "3. 'Go-slow', 'sit-down', 'pen-down', or 'stay-in' actions",
            "4. Absence from work for participation in a Bandh"
        ],
        options: [
            "1 and 3 only",
            "1, 2, and 3 only",
            "2, 3, and 4 only",
            "1, 2, 3, and 4"

];

let currentQ = 0;
let userAnswers = new Array(questions.length).fill(null);
let hasMadeWrongAnswer = false; // Tracks if a wrong answer has been given to set prize to ₹0
let lifelines = { fiftyFifty: true, poll: true, expert: true };

function initQuiz() {
    renderPrizeTracker();
    loadQuestion();
}

function renderPrizeTracker() {
    const container = document.getElementById("prize-tracker");
    container.innerHTML = "";
    prizeLadder.forEach((prize, index) => {
        const step = document.createElement("div");
        const isAnswered = userAnswers[index] !== null;
        const isCurrent = (index === currentQ);
        
        let statusClass = "";
        if (isCurrent) {
            statusClass = "active";
        } else if (isAnswered) {
            statusClass = (userAnswers[index] === questions[index].answer) ? "passed-correct" : "passed-wrong";
        }

        // If any wrong answer occurred, display ₹0 in the ladder for current/subsequent or show crossed prize
        let displayPrize = prize;
        if (hasMadeWrongAnswer && isAnswered && userAnswers[index] !== questions[index].answer) {
            displayPrize = "₹0";
        }

        step.className = `prize-step ${statusClass}`;
        step.innerHTML = `<span>Q${index + 1}</span> <span>${displayPrize}</span>`;
        container.appendChild(step);
    });
}

function loadQuestion() {
    const q = questions[currentQ];
    document.getElementById("q-number").innerText = `Question ${currentQ + 1} of 50 (${q.section})`;
    document.getElementById("pattern-badge").innerText = `${q.type} Pattern`;
    
    // Check current prize status based on wrong answers
    if (hasMadeWrongAnswer) {
        document.getElementById("q-prize").innerText = `Current Prize: ₹0`;
    } else {
        document.getElementById("q-prize").innerText = `Current Prize Level: ${prizeLadder[currentQ]}`;
    }

    document.getElementById("q-text").innerText = q.question;
    
    const stmtContainer = document.getElementById("q-statements");
    stmtContainer.innerHTML = "";
    if (q.statements && q.statements.length > 0) {
        q.statements.forEach(stmt => {
            const div = document.createElement("div");
            div.innerText = stmt;
            stmtContainer.appendChild(div);
        });
    }

    const optContainer = document.getElementById("options-container");
    optContainer.innerHTML = "";

    const isAnswered = userAnswers[currentQ] !== null;
    const selectedIdx = userAnswers[currentQ];

    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.id = `opt-${idx}`;
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
        
        if (isAnswered) {
            btn.disabled = true;
            if (idx === q.answer) {
                btn.classList.add("correct");
            } else if (idx === selectedIdx) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = () => selectOption(idx);
        }
        optContainer.appendChild(btn);
    });

    const expBox = document.getElementById("explanation-box");
    const expText = document.getElementById("explanation-text");
    if (isAnswered) {
        expText.innerText = q.citation;
        expBox.style.display = "block";
    } else {
        expBox.style.display = "none";
    }

    // Navigation buttons state
    document.getElementById("prev-btn").disabled = (currentQ === 0);
    document.getElementById("next-btn").disabled = !isAnswered;

    renderPrizeTracker();
}

function selectOption(selectedIdx) {
    if (userAnswers[currentQ] !== null) return;
    
    userAnswers[currentQ] = selectedIdx;
    const q = questions[currentQ];
    const correctIdx = q.answer;

    const optBtns = document.querySelectorAll(".option-btn");
    optBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIdx) {
            btn.classList.add("correct");
        } else if (idx === selectedIdx) {
            btn.classList.add("wrong");
        }
    });

    // Check if the answer is wrong
    if (selectedIdx !== correctIdx) {
        hasMadeWrongAnswer = true;
        document.getElementById("q-prize").innerText = `Current Prize: ₹0 (Wrong Answer)`;
    } else {
        if (!hasMadeWrongAnswer) {
            document.getElementById("q-prize").innerText = `Current Prize Level: ${prizeLadder[currentQ]}`;
        }
    }

    const expBox = document.getElementById("explanation-box");
    const expText = document.getElementById("explanation-text");
    expText.innerText = q.citation;
    expBox.style.display = "block";

    document.getElementById("next-btn").disabled = false;
    renderPrizeTracker();
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function nextQuestion() {
    if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion();
    } else {
        showFinalSummary();
    }
}

function showFinalSummary() {
    let rightCount = 0;
    let wrongCount = 0;
    let unattempted = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans === null) {
            unattempted++;
        } else if (ans === questions[idx].answer) {
            rightCount++;
        } else {
            wrongCount++;
        }
    });

    const finalPrizeWon = (wrongCount === 0 && unattempted === 0) ? "₹200 Crore" : "₹0";

    const bodyHtml = `
        <p>You have completed the entire 50-Question Master Quiz on CCS (Conduct) Rules, 1964.</p>
        <div class="score-card">
            <div class="score-item">
                <span>Total Right ✅</span>
                <span class="score-val-right">${rightCount}</span>
            </div>
            <div class="score-item">
                <span>Total Wrong ❌</span>
                <span class="score-val-wrong">${wrongCount}</span>
            </div>
        </div>
        <p style="margin-top: 15px; font-size: 1.05rem; font-weight: bold; color: var(--accent-gold);">
            Final Prize Won: ${finalPrizeWon}
        </p>
        <p style="margin-top: 5px; font-size: 0.88rem; color: #94a3b8;">
            Total Questions: 50 | Attempted: ${rightCount + wrongCount} | Unattempted: ${unattempted}
        </p>
    `;

    document.getElementById("modal-title").innerText = "Quiz Performance Summary";
    document.getElementById("modal-body").innerHTML = bodyHtml;
    document.getElementById("modal-close-btn").innerText = "Review All Questions";
    document.getElementById("info-modal").style.display = "flex";
}

function useFiftyFifty() {
    if (!lifelines.fiftyFifty || userAnswers[currentQ] !== null) return;
    lifelines.fiftyFifty = false;
    document.getElementById("life-5050").disabled = true;

    const correctIdx = questions[currentQ].answer;
    let removed = 0;
    for (let i = 0; i < 4; i++) {
        if (i !== correctIdx && removed < 2) {
            const el = document.getElementById(`opt-${i}`);
            if (el) el.style.visibility = "hidden";
            removed++;
        }
    }
}

function useAudiencePoll() {
    if (!lifelines.poll || userAnswers[currentQ] !== null) return;
    lifelines.poll = false;
    document.getElementById("life-poll").disabled = true;

    const correctIdx = questions[currentQ].answer;
    let votes = [10, 10, 10, 10];
    votes[correctIdx] = 70;

    let resultMsg = "Audience Poll Verdict:<br><br>";
    votes.forEach((v, i) => {
        resultMsg += `<strong>Option ${String.fromCharCode(65 + i)}:</strong> ${v}%<br>`;
    });

    showModal("Audience Poll", resultMsg);
}

function useAskExpert() {
    if (!lifelines.expert || userAnswers[currentQ] !== null) return;
    lifelines.expert = false;
    document.getElementById("life-expert").disabled = true;

    const correctOption = String.fromCharCode(65 + questions[currentQ].answer);
    const sec = questions[currentQ].section;
    
    showModal("Ask The Expert", `Expert Guidance: "According to the statutory provisions of <strong>${sec}</strong> under the CCS (Conduct) Rules 1964, the correct answer is <strong>Option ${correctOption}</strong>."`);
}

function showModal(title, body) {
    document.getElementById("modal-title").innerHTML = title;
    document.getElementById("modal-body").innerHTML = body;
    document.getElementById("modal-close-btn").innerText = "Continue";
    document.getElementById("info-modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("info-modal").style.display = "none";
}

window.onload = initQuiz;
</script>
</body>
</html>
